<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — not</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Page not found.">
  <meta name="theme-color" content="#0e0e10">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e0e10'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='19' font-weight='bold' fill='%23f0a13a' text-anchor='middle'%3En%3C/text%3E%3C/svg%3E">

  <script>
    (function () {
      var theme = "dark";
      try {
        theme = localStorage.getItem("theme") ||
          ((window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark");
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "light" ? "#f6f6f8" : "#0e0e10");
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
  <!-- Absolute on purpose. GitHub Pages serves this one file for URLs at any
       depth, so a relative path would resolve against the missing URL
       (/deep/path/site.css) instead of against this file. -->
  <link rel="stylesheet" href="/site.css">

  <style>
    /* Everything else comes from site.css, so the palette lives in one place. */
    body { display: grid; place-items: center; padding: 40px 24px; text-align: center; }
    .wrap { width: 100%; max-width: 560px; }

    .code {
      margin: 0 0 6px;
      font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
      font-size: clamp(3.4rem, 14vw, 6rem);
      font-weight: 500;
      letter-spacing: -.04em;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    .wrap h1 {
      margin: 0 0 12px;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .msg { margin: 0 0 28px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <h1>nothing here.</h1>
    <p class="msg">this page doesn't exist — or it wandered off to a better vps.</p>
    <a class="btn btn-primary" href="/">&larr; go home</a>
  </main>
</body>
</html>
